<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Polska Droga do Gwiazdy</title>
<style>
:root{--bg:#07101a;--panel:#10243a;--panel2:#183b57;--line:#426a88;--gold:#ffb000;--text:#f5f9fc;--muted:#a9bfce}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#174b70 0,#0b2234 33%,#050a10 78%);color:var(--text);font-family:Tahoma,Verdana,Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px),radial-gradient(circle at center,transparent 28%,rgba(0,0,0,.55) 100%)}
.boot{position:relative;width:min(560px,calc(100vw - 34px));padding:26px;border:3px solid #03070b;border-radius:7px;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 38%),linear-gradient(145deg,var(--panel2),var(--panel));box-shadow:inset 0 0 0 2px #6d9ab8,7px 8px 0 #020508,0 28px 80px #000b}
.badge{display:inline-block;margin-bottom:15px;padding:5px 9px;border:2px solid #05090f;background:var(--gold);color:#1a1100;font-weight:900;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;box-shadow:2px 2px 0 #000}
h1{margin:0 0 8px;font:900 clamp(27px,6vw,42px)/1 "Arial Black",Impact,Tahoma,sans-serif;letter-spacing:-1.5px;text-transform:uppercase;text-shadow:0 3px #07101a,3px 5px #0008}
p{margin:0;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.3px}
.track{height:15px;margin-top:24px;padding:2px;border:2px solid #020609;background:#06121d;box-shadow:inset 0 0 0 1px #395d76,2px 3px 0 #000}
.bar{height:100%;width:5%;background:repeating-linear-gradient(135deg,rgba(255,255,255,.26) 0 6px,transparent 6px 12px),linear-gradient(90deg,#e27a00,var(--gold),#ffd764);transition:width .18s ease;box-shadow:0 0 15px #ffb00066}
.meta{display:flex;justify-content:space-between;gap:14px;margin-top:9px;color:#8fb3ca;font:800 10px/1.2 "Courier New",monospace;text-transform:uppercase}
.err{display:none;margin-top:17px;padding:11px;border:2px solid #5f1717;background:#351315;color:#ffd3d3;font-size:12px;line-height:1.45}
@media(max-width:520px){.boot{padding:20px}.meta{font-size:9px}}
</style>
</head>

<main class="boot" aria-live="polite">

</main>

const bar=document.getElementById('bar'),pct=document.getElementById('pct'),status=document.getElementById('status'),step=document.getElementById('step'),err=document.getElementById('err');
const paint=(n,s,t)=>{bar.style.width=n+'%';pct.textContent=n+'%';step.textContent=s;status.textContent=t;};
const tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
function unmask(bytes){let s=0x50444761>>>0;for(let i=0;i<bytes.length;i++){s^=(s<<13);s>>>=0;s^=(s>>>17);s>>>=0;s^=(s<<5);s>>>=0;bytes[i]^=(s&255);}return bytes;}
async function boot(){
 try{
   if(typeof DecompressionStream!=='function')throw new Error('Ta przeglądarka nie obsługuje wbudowanego rozpakowywania GZIP (DecompressionStream).');
   paint(9,'PAKIET','Odczytywanie skompresowanej gry...'); await tick();
   const blocks=[]; let total=0; const part=65532;
   for(let pos=0;pos<DATA.length;pos+=part){
     const bin=atob(DATA.slice(pos,pos+part)); const a=new Uint8Array(bin.length);
     for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
     blocks.push(a); total+=a.length;
     if((pos/part)%8===0){const n=9+Math.floor(36*Math.min(1,(pos+part)/DATA.length));paint(n,'PAKIET','Odczytywanie skompresowanej gry...');await tick();}
   }
   const packed=new Uint8Array(total); let off=0; for(const a of blocks){packed.set(a,off);off+=a.length;}
   paint(52,'DEKODOWANIE','Otwieranie pakietu...'); await tick(); unmask(packed);
   paint(64,'ROZPAKOWYWANIE','Rozpakowywanie gry...'); await tick();
   const stream=new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
   const html=await new Response(stream).text();
   paint(92,'START','Uruchamianie kariery...'); await tick();
   document.title=TITLE;
   document.open(); document.write(html); document.close();
 }catch(e){
   console.error(e); paint(100,'BŁĄD','Nie udało się uruchomić gry.');
   err.style.display='block'; err.textContent='Błąd pakietu: '+(e&&e.message?e.message:String(e));
 }
}
boot();
})();
