<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d1d">
<link rel="icon" href="data:,">
<title>First Touch · VR Football</title>
<link rel="stylesheet" href="./styles/main.css">
</head>
<body>
<svg class="symbols" aria-hidden="true"><defs>
<symbol id="icon-pitch" viewBox="0 0 100 60"><rect x="3" y="3" width="94" height="54" rx="2"/><path d="M50 3v54M3 18h14v24H3m94-24H83v24h14"/><circle cx="50" cy="30" r="11"/></symbol>
<symbol id="icon-ball" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14"/><path d="m16 9 7 5-3 8h-8l-3-8Z" fill="currentColor" stroke="none"/></symbol>
<symbol id="icon-heart" viewBox="0 0 28 26"><path d="M14 23 3 13C-4 5 7-4 14 5c7-9 18 0 11 8Z"/></symbol>
</defs></svg>
<main id="launcher" data-mode="freeroam" data-active="false" data-input="vr">
<section class="card" aria-label="First Touch">
<header class="brand"><h1><span>FIRST</span>TOUCH</h1><div class="orbit-mark" aria-hidden="true"><i></i><b></b><svg><use href="#icon-ball"/></svg></div></header>
<div class="pause-title"><span id="pause-label">PAUSED</span><strong id="pause-score"></strong></div>
<div id="mode-select" class="mode-select" role="group" aria-label="Game mode">
<button id="mode-freeroam" class="mode" type="button" aria-pressed="true"><span class="mode-title">Freeroam<i class="selected-dot" aria-hidden="true"></i></span><svg class="pitch-icon" aria-hidden="true"><use href="#icon-pitch"/></svg></button>
<button id="mode-challenge" class="mode challenge" type="button" aria-pressed="false" aria-label="3 Touch: three touches, three lives"><span class="mode-title">3 TOUCH<i class="selected-dot" aria-hidden="true"></i></span><span class="mode-pips" aria-hidden="true"><span class="touch-pips"><svg><use href="#icon-ball"/></svg><svg><use href="#icon-ball"/></svg><svg><use href="#icon-ball"/></svg></span><span class="life-pips"><svg><use href="#icon-heart"/></svg><svg><use href="#icon-heart"/></svg><svg><use href="#icon-heart"/></svg></span></span></button>
</div>
<div class="play-actions"><button class="primary" id="enter-vr" disabled>Enter VR <span aria-hidden="true">↗</span></button><button class="secondary" id="desktop" disabled>Play on screen</button><button class="primary" id="resume" hidden>Resume</button><button class="secondary" id="restart" hidden>New run</button><button class="secondary" id="exit" hidden>Exit</button></div>
<details class="controls-help"><summary>Controls <span aria-hidden="true">+</span></summary><div class="controls vr-controls"><span><b>L stick</b> Move</span><span><b>R stick</b> Turn</span><span><b>Trigger</b> Instep</span><span><b>Grip</b> Sprint</span><span class="free-control"><b>A</b> New ball</span><span><b>X</b> Calibrate</span><span><b>Y</b> Menu</span></div><div class="controls desktop-controls"><span><b>WASD</b> Move</span><span><b>Mouse / ← →</b> Turn</span><span><b>Space / Click</b> Kick</span><span><b>Shift</b> Sprint</span><span><b>E</b> Instep</span><span class="free-control"><b>B</b> New ball</span><span><b>Esc</b> Menu</span></div></details>
<p class="status" id="status" role="status">Loading…</p>
</section>
</main>
<canvas id="desktop-hud" width="900" height="250" hidden role="img" aria-label="Challenge status"></canvas>
<div id="desktop-hint" hidden><b>WASD</b> Move <b>Space</b> Kick <b>Esc</b> Menu</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
