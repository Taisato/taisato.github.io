<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14211f">
<link rel="icon" href="data:,">
<title>First Touch · Piłka nożna VR</title>
<style>
  * { box-sizing:border-box }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#020309; color:#edf1e8; font:16px system-ui,sans-serif }
  button,select { font:inherit }
  button { cursor:pointer }
  button:focus-visible,select:focus-visible { outline:3px solid #ebf5b8; outline-offset:3px }
  button:disabled { opacity:.46; cursor:default }
  [hidden] { display:none!important }
  #pitch-view { position:fixed; inset:0; display:block; width:100%; height:100% }
  #launcher { position:fixed; inset:0; display:grid; place-items:center; padding:16px; background:#0a1e15a8; backdrop-filter:blur(4px); overflow:auto }
  .card { width:min(470px,100%); padding:29px; background:#14251e; border:1px solid #6a8371; border-radius:12px; box-shadow:0 30px 95px #07171087 }
  h1 { margin:0 0 24px; color:#eff6e8; font-size:clamp(32px,8vw,47px); font-stretch:condensed; font-weight:870; line-height:1; letter-spacing:-.063em }
  .mark { display:block; width:28px; height:3px; border-radius:4px; background:#d8eda3; margin-bottom:15px }
  .modes { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 0 15px }
  .modes button { min-height:45px; padding:8px; background:#182d25; border:1px solid #4f6b5b; color:#dfebdf; font-size:14px; font-weight:650; border-radius:5px }
  .modes button[aria-pressed="true"] { background:#315244; border-color:#a7cb95; color:#f1f8e4 }
  .position { display:flex; align-items:center; justify-content:space-between; gap:11px; margin:0 0 13px; font-size:14px; color:#e0ebdb }
  .position select { min-width:0; flex:1; min-height:39px; padding:5px 8px; border:1px solid #4f6b5b; border-radius:5px; background:#182d25; color:#edf4e9; color-scheme:dark }
  .launch { display:grid; grid-template-columns:1fr 1fr; gap:8px }
  .launch button { min-height:47px; padding:9px 8px; border:1px solid #526d5a; border-radius:5px; font-size:14px; font-weight:700 }
  .primary { background:#d8eda3; color:#15271b }
  .secondary { background:#1b3027; color:#e6efd9 }
  .primary:hover:not(:disabled) { background:#e7f3bc }
  .secondary:hover:not(:disabled) { background:#314e40 }
  .controls { margin:19px 0 0; display:grid; grid-template-columns:1fr 1fr; gap:8px 13px; font-size:12px; color:#b9cbb9; line-height:1.4 }
  .controls b { color:#e8eee3 }
  .status { font-size:12px; line-height:1.4; color:#c9d7c7; margin:13px 0 0 }
  .status:empty { display:none }
  #desktop-hint { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); width:max-content; max-width:calc(100% - 22px); text-align:center; color:#edf3e4; font-size:12px; background:#14251ee6; padding:8px 11px; border-radius:5px; pointer-events:none }
  #match-hud { position:fixed; top:12px; right:12px; width:min(203px,32vw); height:auto; pointer-events:none }
  @media (max-width:500px),(max-height:560px) { .card { padding:21px } .controls { font-size:11px } h1 { margin-bottom:16px } }
</style>
<script defer src="./three-core.js"></script>
<script defer src="./keeper-meshes.js"></script>
<script defer src="./match-engine.js"></script>
<script defer src="./match-visuals.js"></script>
<script defer src="./football.js"></script>
</head>
<body>
<main id="launcher">
  <section class="card" aria-label="Menu gry">
    <span class="mark" aria-hidden="true"></span>
    <h1>FIRST TOUCH</h1>
    <div id="modes" class="modes" role="group" aria-label="Tryb gry">
      <button type="button" id="mode-free" aria-pressed="true">Wolna gra</button>
      <button type="button" id="mode-match" aria-pressed="false">Mecz 11 na 11</button>
    </div>
    <label class="position" id="position-row" hidden>Pozycja <select id="position"></select></label>
    <div class="launch">
      <button type="button" class="primary" id="enter-vr" disabled>Graj w VR</button>
      <button type="button" class="secondary" id="desktop">Graj na ekranie</button>
      <button type="button" class="primary" id="resume" hidden>Wznów</button>
      <button type="button" class="secondary" id="exit" hidden>Menu główne</button>
    </div>
    <div class="controls"><span><b>Lewy drążek</b> ruch</span><span><b>Prawy drążek</b> obrót</span><span><b>Spust</b> podbicie</span><span><b>Chwyt</b> sprint</span><span id="mode-control"><b>B</b> nowa piłka</span><span><b>X</b> kalibracja · <b>Y</b> menu</span></div>
    <p class="status" id="status" role="status"></p>
  </section>
</main>
<canvas id="match-hud" width="420" height="278" aria-label="Wynik i ustawienie drużyn" hidden></canvas>
<div id="desktop-hint" hidden></div>
</body>
</html>
